name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/nifty-lamport-vbqz8j
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，新的把排队中的顶掉
concurrency:
  group: pages
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint, typecheck and unit tests
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test

      - name: Build static site
        run: pnpm build:static
        env:
          # 项目页部署在 https://<owner>.github.io/<repo>/
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}

      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      # 这一步要求仓库已开启 Pages 且来源设为 GitHub Actions。
      # 工作流令牌没有创建 Pages 站点的权限（Resource not accessible by
      # integration），所以首次必须由仓库所有者在 Settings → Pages 里手动开启。
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
